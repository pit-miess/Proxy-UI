
name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.x"

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 4.0.5
          "$env:USERPROFILE\.dotnet\tools" |
            Out-File -FilePath $env:GITHUB_PATH -Append

          wix extension add --global WixToolset.UI.wixext/4.0.5

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) {
            python -m pip install -r requirements.txt
          }
          python -m pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --noconsole --onefile --name "Proxy-UI-onefile-windows" --icon icon.ico "main.py"

      - name: Build Standalone EXE
        run: |
          pyinstaller --noconsole --onedir --name "Proxy-UI-standalone-windows" --icon icon.ico "main.py"
      
      - name: Create MSI Installer
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $match = [regex]::Match(
            $tag,
            '^v?(\d+)\.(\d+)\.(\d+)$'
          )

          if (-not $match.Success) {
            throw "Use a stable version tag such as v1.2.3 for MSI releases."
          }

          $version = "$($match.Groups[1].Value).$($match.Groups[2].Value).$($match.Groups[3].Value)"

          wix build installer.wxs `
            -arch x64 `
            -ext WixToolset.UI.wixext/4.0.5 `
            -d "PublishDir=dist/Proxy-UI-standalone-windows" `
            -d "ProductVersion=$version" `
            -o "dist/Proxy-UI-setup-windows.msi"
      
      - name: Zip Standalone Build
        run: |
          Compress-Archive `
            -Path "dist/Proxy-UI-standalone-windows/*" `
            -DestinationPath "dist/Proxy-UI-standalone-windows.zip"

      - name: Upload Windows Builds
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            dist/Proxy-UI-onefile-windows.exe
            dist/Proxy-UI-setup-windows.msi
            dist/Proxy-UI-standalone-windows.zip

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi
          python -m pip install pyinstaller

      - name: Build Linux Executable
        run: |
          pyinstaller --noconsole --onefile \
            --name "Proxy-UI-onefile-linux" --icon icon.ico main.py

      - name: Build Linux Standalone
        run: |
          pyinstaller --noconsole --onedir \
            --name "Proxy-UI-standalone-linux" --icon icon.ico main.py

      - name: Archive Linux Standalone
        run: |
          tar -czf dist/Proxy-UI-standalone-linux.tar.gz \
            -C dist Proxy-UI-standalone-linux

      - name: Upload Linux Builds
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            dist/Proxy-UI-onefile-linux
            dist/Proxy-UI-standalone-linux.tar.gz

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download All Builds
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate Release Notes
        id: release_notes
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"

          # Find the previous version tag, if one exists.
          PREVIOUS_TAG=$(git tag --list 'v*' --sort=-version:refname \
            | grep -Fxv "$TAG" | head -n 1 || true)

          {
            echo "body<<RELEASE_NOTES_EOF"
            echo "## Proxy-UI ${TAG}"
            echo
            echo "### Downloads"
            echo "- **Windows (single executable):** \`Proxy-UI-onefile-windows.exe\`"
            echo "- **RECOMMMENDED Windows (MSI installer):** \`Proxy-UI-setup-windows.msi\`"
            echo "- **Windows (standalone):** \`Proxy-UI-standalone-windows.zip\`"
            echo "- **Linux (single executable):** \`Proxy-UI-onefile-linux\`"
            echo "- **Linux (standalone):** \`Proxy-UI-standalone-linux.tar.gz\`"
            echo
            echo "### Changes"
            if [ -n "$PREVIOUS_TAG" ]; then
              git log --pretty=format:'- %s (%h)' \
                "${PREVIOUS_TAG}..${TAG}"
            else
              git log -n 20 --pretty=format:'- %s (%h)' "${TAG}"
            fi
            echo
            echo
            echo "### Installation"
            echo "- Windows: download the EXE or extract the standalone ZIP."
            echo "- Linux: download the executable or extract the TAR.GZ archive."
            echo
            echo "This is automatically generated"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Proxy-UI ${{ github.ref_name }}"
          body: ${{ steps.release_notes.outputs.body }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            dist/Proxy-UI-onefile-windows.exe
            dist/Proxy-UI-setup-windows.msi
            dist/Proxy-UI-standalone-windows.zip
            dist/Proxy-UI-onefile-linux
            dist/Proxy-UI-standalone-linux.tar.gz